<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQUIPO-COT-PLN - Repositorio de Archivos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="LOGO_CERTUS.png" alt="Certus Logo" class="certus-logo">
            <div class="site-title">EQUIPO-COT-PLN</div>
        </div>
        <nav class="nav-menu">
            <a href="#" class="nav-link active">Página principal <i class="fas fa-chevron-down" style="font-size: 0.8rem; margin-left: 5px;"></i></a>
            <div class="search-icon"><i class="fas fa-search"></i></div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Repositorio de archivos Contabilidad PLN 2026</h1>
            <div class="underline"></div>
        </section>

        <div class="grid-container">
            <a href="javascript:void(0)" onclick="openProtectedUrl('https://sites.google.com/view/equipo-cot-pln/principal', 'Repositorio CONTA/PLN')" class="card">
                <img src="assets/repositorio.png" alt="Repositorio CONTA/PLN">
                <span class="card-title">Repositorio CONTA/PLN</span>
            </a>
            <a href="javascript:void(0)" onclick="openProtectedUrl('https://eduardoaeges.github.io/eventos/', 'Gestor de eventos')" class="card">
                <img src="assets/eventos.png" alt="Gestor de eventos">
                <span class="card-title">Gestor de eventos</span>
            </a>
            <a href="buscador.html" class="card">
                <img src="assets/buscador.png" alt="Buscador y Carga Docente">
                <span class="card-title">Buscador y Carga Docente</span>
            </a>
            <a href="status.html" class="card">
                <img src="assets/status_asesorias.png" alt="Status de Asesorías">
                <span class="card-title">Status de Asesorías</span>
            </a>
            <a href="horario.html" class="card">
                <img src="assets/horarios.png" alt="Horario">
                <span class="card-title">Horario</span>
            </a>
        </div>
    </main>

    <!-- Password Modal -->
    <div id="passwordModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <i class="fas fa-lock"></i>
                <div class="modal-title" id="modalTitle">Acceso Restringido</div>
                <div class="modal-subtitle">Ingrese la clave de seguridad para continuar</div>
            </div>
            <div class="modal-body">
                <input type="password" id="modalInput" class="modal-input" placeholder="••••" autocomplete="off">
                <div id="modalError" class="modal-error">Clave incorrecta. Intente de nuevo.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancelar</button>
                <button type="button" class="modal-btn modal-btn-confirm" onclick="submitPassword()">Acceder</button>
            </div>
        </div>
    </div>

    <script>
        // Smooth reveal animation for cards
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                setTimeout(() => {
                    card.style.transition = 'all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 * index);
            });
        });

        let targetUrl = '';

        function openProtectedUrl(url, name) {
            targetUrl = url;
            document.getElementById('modalTitle').innerText = name;
            document.getElementById('passwordModal').classList.add('active');
            document.getElementById('modalInput').value = '';
            document.getElementById('modalError').style.display = 'none';
            setTimeout(() => document.getElementById('modalInput').focus(), 150);
        }

        function closeModal() {
            document.getElementById('passwordModal').classList.remove('active');
            targetUrl = '';
        }

        function submitPassword() {
            const input = document.getElementById('modalInput').value;
            const errorEl = document.getElementById('modalError');
            const container = document.querySelector('.modal-container');
            
            if (input.trim() === 'CONTA') {
                window.open(targetUrl, '_blank');
                closeModal();
            } else {
                errorEl.style.display = 'block';
                container.classList.add('shake');
                setTimeout(() => {
                    container.classList.remove('shake');
                }, 300);
            }
        }

        // Close on escape key or submit on Enter key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && document.getElementById('passwordModal').classList.contains('active')) {
                submitPassword();
            }
        });
    </script>
</body>
</html>
