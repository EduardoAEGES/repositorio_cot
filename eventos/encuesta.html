<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistencia y Encuesta - CERTUS</title>
    
    <!-- Phosphor Icons para las estrellas -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #0a2f5f;
            --primary-hover: #071f40;
            --bg-color: #eef1f6;
            --border: #e2e8f0;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2563eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .form-container {
            background: white;
            width: 100%;
            max-width: 770px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            overflow: hidden;
            position: relative;
        }

        .form-header {
            background: var(--primary);
            color: white;
            padding: 24px 30px;
            position: relative;
        }

        .form-header h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 14px;
            color: #cbd5e1;
        }

        .btn-close {
            position: absolute;
            top: 24px;
            right: 24px;
            background: rgba(255,255,255,0.15);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-close:hover { background: rgba(255,255,255,0.3); }

        .form-body {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .optional-txt {
            font-weight: 400;
            color: var(--text-muted);
            font-size: 13px;
        }

        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, select:focus, textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Stars */
        .stars-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .star {
            color: #cbd5e1;
            font-size: 32px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star.active, .star.hover {
            /* We will handle hover with JS to do left-to-right fill */
            color: #facc15;
        }
        /* Interactive Stars */
        .stars-container {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            font-size: 32px;
            align-items: center;
        }
        .stars-container i {
            cursor: pointer;
            transition: color 0.2s;
            color: #cbd5e1;
        }
        .stars-container i.active,
        .stars-container i.hover {
            color: #facc15;
        }
        .star-label {
            white-space: nowrap;
            margin-left: 10px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Interactive NPS */
        .nps-container {
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            margin-top: 6px;
            gap: 6px;
        }
        .nps-btn {
            width: 100%;
            max-width: 44px;
            aspect-ratio: 1;
            justify-self: center;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s;
        }
        .nps-btn:hover {
            border-color: var(--text-muted);
            color: var(--text-main);
        }
        .nps-btn.selected {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        /* Cada pregunta de calificación en su propio bloque para que no se vea apiñado */
        .pregunta {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px 18px 20px;
            gap: 12px;
        }
        .pregunta label { font-size: 15px; }
        .pregunta textarea { background: white; }

        .nps-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            font-size: 12px;
            color: var(--text-muted);
            padding: 0 5px;
        }

        .btn-submit {
            background: var(--accent);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #1d4ed8;
        }
        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .msg-container {
            display: none;
            text-align: center;
            padding: 60px 30px;
        }
        .msg-container i {
            font-size: 64px;
            color: #10b981;
            margin-bottom: 16px;
        }
        .msg-container h2 {
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 8px;
        }
        .msg-container p {
            color: var(--text-muted);
        }

        @media(max-width: 500px) {
            .nps-container { grid-template-columns: repeat(6, 1fr); gap: 8px; }
            .stars-container { flex-wrap: wrap; row-gap: 4px; }
            .star-label { margin-left: 2px; }
            .nps-btn { font-size: 12px; }
            .pregunta { padding: 14px 12px 16px; }
            .radio-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="form-container" id="main-card">
        <img id="portada-img" alt="Portada del evento"
             style="display:none; width:100%; max-height:240px; object-fit:cover;">
        <div class="form-header" style="text-align: center; padding-bottom: 20px;">
            <img id="header-logo" src="LOGO_CERTUS.png" alt="CERTUS" style="max-height: 50px; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto;">
            <p style="margin-top:5px;">Registra tu participación y ayúdanos a seguir mejorando.</p>
            <button class="btn-close" onclick="window.close()" style="position:absolute; top:20px; right:20px; background:none; border:none; cursor:pointer; font-size:24px; color:white;"><i class="ph ph-x"></i></button>
        </div>

        <form class="form-body" id="encuesta-form">
            <!-- Hidden input for evento_id passed via URL -->
            <input type="hidden" id="evento_id">

            <div class="form-group" id="grupo-evento-select" style="display:none;">
                <label>Selecciona el evento</label>
                <select id="evento_select">
                    <option value="">Cargando eventos...</option>
                </select>
            </div>
            <div class="form-group" id="grupo-evento-nombre" style="display:none;">
                <label>Evento</label>
                <input type="text" id="evento_nombre_display" readonly style="background: #f1f5f9; cursor: not-allowed; font-weight: 500;">
            </div>

            <div id="step-1-session" style="display:none; margin-bottom: 24px;">
                <div class="form-group" id="grupo-sesion-select">
                    <label style="font-size: 16px; color: var(--primary);">Selecciona la sesión a la que asistes hoy <span style="color:#ef4444">*</span></label>
                    <select id="modulo_sesion" required style="font-size: 15px; padding: 14px; border-color: var(--primary); border-width: 2px;">
                        <option value="">-- Elige una opción --</option>
                    </select>
                </div>
            </div>

            <div id="step-2-form" style="display:none; flex-direction: column; gap: 24px;">
                <div class="form-group">
                    <label>Eres: <span style="color:#ef4444">*</span></label>
                    <select id="tipo_usuario" required>
                        <option value="">-- Selecciona una opción --</option>
                        <option value="estudiante">Estudiante CERTUS</option>
                        <option value="docente">Docente CERTUS</option>
                        <option value="egresado">Egresado CERTUS</option>
                        <option value="invitado">Invitado / Público en general</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>DNI o Documento de Identidad <span style="color:#ef4444">*</span></label>
                    <input type="text" id="dni" placeholder="Ingresa tu documento..." required>
                    <span id="dni-error" style="color:#ef4444; font-size:12px; display:none;">El DNI para estudiantes debe tener al menos 8 dígitos.</span>
                </div>

                <div class="radio-grid" style="grid-template-columns: 1fr 1fr;">
                    <div class="form-group">
                        <label>Nombres <span style="color:#ef4444">*</span></label>
                        <input type="text" id="nombres" placeholder="Tus nombres..." required>
                    </div>
                    <div class="form-group">
                        <label>Apellidos <span style="color:#ef4444">*</span></label>
                        <input type="text" id="apellidos" placeholder="Tus apellidos..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Correo Electrónico <span style="color:#ef4444">*</span></label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required style="width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text-main); outline: none; transition: border-color 0.2s;">
                    <span id="correo-error" style="color:#ef4444; font-size:12px; display:none;">El correo debe terminar en @certus.edu.pe</span>
                </div>

                <div class="form-group">
                    <label>Sede a la que pertenece <span style="color:#ef4444">*</span></label>
                    <select id="sede" required>
                        <option value="">-- Selecciona una opción --</option>
                        <option value="Arequipa">Sede Arequipa</option>
                        <option value="Ate">Sede Ate</option>
                        <option value="Norte">Sede Norte</option>
                        <option value="San Juan de Lurigancho">Sede San Juan de Lurigancho</option>
                        <option value="Surco">Sede Surco</option>
                        <option value="Villa el Salvador">Sede Villa el Salvador</option>
                        <option value="Virtual">Sede Virtual</option>
                        <option value="Invitado">Invitado</option>
                    </select>
                </div>

                <div class="form-group pregunta">
                    <label>¿Qué tan satisfecho(a) quedaste con <span id="txt-actividad">la actividad</span>? <span style="color:#ef4444">*</span></label>
                    <div class="stars-container" id="stars-group">
                        <i class="ph-fill ph-star star" data-val="1"></i>
                        <i class="ph-fill ph-star star" data-val="2"></i>
                        <i class="ph-fill ph-star star" data-val="3"></i>
                        <i class="ph-fill ph-star star" data-val="4"></i>
                        <i class="ph-fill ph-star star" data-val="5"></i>
                        <span class="star-label" id="star-text">Toca una estrella</span>
                    </div>
                    <input type="hidden" id="facilidad" required>
                </div>

                <div class="form-group pregunta">
                    <label>¿Recomendarías esta actividad? <span style="color:#ef4444">*</span></label>
                    <div class="nps-container" id="nps-group">
                        <!-- JS rellena del 0 al 10 -->
                    </div>
                    <div class="nps-labels">
                        <span>Nada probable</span>
                        <span>Muy probable</span>
                    </div>
                    <input type="hidden" id="nps" required>
                </div>

                <div class="form-group pregunta">
                    <label>Comentarios <span class="optional-txt">(opcional)</span></label>
                    <textarea id="comentarios" placeholder="¿Qué podríamos mejorar?"></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">Enviar Respuestas</button>
        </form>

        <div class="msg-container" id="success-msg">
            <i class="ph-fill ph-check-circle"></i>
            <h2>¡Gracias por tus respuestas!</h2>
            <p>Tus comentarios nos ayudan a seguir mejorando.</p>
        </div>
    </div>

    <script>
        // CONFIGURAR SUPABASE (Reemplazar con tus credenciales)
        const supabaseUrl = 'https://klmjmlhwuzhymrplemgw.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtsbWptbGh3dXpoeW1ycGxlbWd3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1OTMyNjQsImV4cCI6MjA4NzE2OTI2NH0.xFWMvUJa9n9TBcBG1WSeqCGiWBaCAtCU9aY7GXk4W6E'; // Llave anónima
        const sbClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Obtener ID del evento de la URL. Formato corto: encuesta.html?e=123&s=1 (s=t -> Taller Completo).
        // Se sigue aceptando el formato antiguo: ?evento_id=123&nombre=...&sesion=Sesión%201
        const urlParams = new URLSearchParams(window.location.search);
        const eventoId = urlParams.get('e') || urlParams.get('evento_id');
        const eventoNombre = urlParams.get('nombre');
        const sesionCorta = urlParams.get('s');
        const sesionPredefinida = sesionCorta
            ? (sesionCorta === 't' ? 'Taller Completo' : `Sesión ${sesionCorta}`)
            : urlParams.get('sesion');

        if(eventoId) {
            document.getElementById('evento_id').value = eventoId;
            document.getElementById('grupo-evento-nombre').style.display = 'block';
            document.getElementById('evento_nombre_display').value = eventoNombre || 'Cargando nombre...';
            cargarDatosEvento(eventoId);
        } else {
            mostrarPortada(null);
            document.getElementById('grupo-evento-select').style.display = 'block';
            document.getElementById('evento_select').required = true;
            cargarEventosDesdeSupabase();
        }

        async function cargarDatosEvento(id) {
            const { data, error } = await sbClient.from('eventos').select('nombre, tipo, horario, portada').eq('id', id).single();
            if (data) {
                mostrarTipoActividad(data.tipo);
                document.getElementById('evento_nombre_display').value = data.nombre;
                mostrarPortada(data.portada);
                actualizarSelectorSesiones(data.horario);
            }
        }

        // "Capacitación" -> "la capacitación", "Kick Off Académico" -> "el kick off académico". Sin tipo -> "la actividad".
        function mostrarTipoActividad(tipo) {
            tipo = (tipo || '').trim();
            let texto = 'la actividad';
            if (tipo) {
                const primera = tipo.split(' ')[0].toLowerCase();
                const excepciones = { programa: false, masterclass: true };
                const femenino = primera in excepciones ? excepciones[primera] : /(a|ión)$/.test(primera);
                texto = (femenino ? 'la ' : 'el ') + tipo.toLowerCase();
            }
            document.getElementById('txt-actividad').textContent = texto;
        }

        function mostrarPortada(url) {
            url = url || 'portada_default.png'; // Portada cuando el evento no tiene una propia
            const img = document.getElementById('portada-img');
            const logo = document.getElementById('header-logo');
            if (url) {
                img.src = url; img.style.display = 'block';
                if (logo) logo.style.display = 'none';   // con portada, el logo repetido sobra
            } else {
                img.style.display = 'none';
                if (logo) logo.style.display = 'block';
            }
        }

        // "2026-10-10" -> "10 de octubre del 2026"
        function fechaLarga(iso) {
            const m = (iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (!m) return iso || '';
            const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
            return `${parseInt(m[3], 10)} de ${meses[parseInt(m[2], 10) - 1]} del ${m[1]}`;
        }

        function actualizarSelectorSesiones(horarioStr) {
            const selectSesion = document.getElementById('modulo_sesion');
            let sesiones = [];
            try { sesiones = JSON.parse(horarioStr || '[]'); } catch(e) {}
            
            if (sesiones.length > 0) {
                selectSesion.innerHTML = '<option value="">-- Elige una opción --</option>';
                sesiones.forEach((s, idx) => {
                    const opt = document.createElement('option');
                    opt.value = `Sesión ${idx + 1}`;
                    opt.textContent = `Sesión ${idx + 1} (${s.fecha})`;
                    selectSesion.appendChild(opt);
                });
                if (sesiones.length > 1) {
                    const optTodos = document.createElement('option');
                    optTodos.value = 'Taller Completo';
                    optTodos.textContent = 'Todas las sesiones';
                    selectSesion.appendChild(optTodos);
                    
                    if (sesionPredefinida) {
                        selectSesion.value = sesionPredefinida;
                        document.getElementById('step-1-session').style.display = 'none';
                        document.getElementById('step-2-form').style.display = 'flex';
                        
                        // Append session and date to event name display
                        let fechaExtra = "";
                        const matchIndex = parseInt(sesionPredefinida.replace('Sesión ', '')) - 1;
                        if (!isNaN(matchIndex) && matchIndex >= 0 && matchIndex < sesiones.length) {
                            fechaExtra = ` - ${sesionPredefinida} (${sesiones[matchIndex].fecha})`;
                        } else if (sesionPredefinida === 'Taller Completo') {
                            fechaExtra = ` - Todas las sesiones`;
                        }
                        if (document.getElementById('evento_nombre_display').value.indexOf(fechaExtra) === -1) {
                            document.getElementById('evento_nombre_display').value += fechaExtra;
                        }
                    } else {
                        document.getElementById('step-1-session').style.display = 'block';
                        document.getElementById('step-2-form').style.display = 'none';
                    }
                } else {
                    document.getElementById('step-1-session').style.display = 'none';
                    document.getElementById('step-2-form').style.display = 'flex';
                    selectSesion.value = sesionPredefinida || 'Sesión 1';
                    
                    // Sesión única: solo la fecha, ej. "10 de octubre del 2026"
                    const fechaExtra = ` - ${fechaLarga(sesiones[0].fecha)}`;
                    if (document.getElementById('evento_nombre_display').value.indexOf(fechaExtra) === -1) {
                        document.getElementById('evento_nombre_display').value += fechaExtra;
                    }
                }
            } else {
                document.getElementById('step-1-session').style.display = 'none';
                document.getElementById('step-2-form').style.display = 'flex';
                if (sesionPredefinida) selectSesion.value = sesionPredefinida;
            }
        }

        document.getElementById('modulo_sesion').addEventListener('change', (e) => {
            if(e.target.value) {
                document.getElementById('step-2-form').style.display = 'flex';
            } else {
                document.getElementById('step-2-form').style.display = 'none';
            }
        });

        async function cargarEventosDesdeSupabase() {
            // Se seleccionan los eventos y el horario para mostrar la fecha.
            const { data, error } = await sbClient.from('eventos').select('id, nombre, tipo, horario, portada').order('created_at', { ascending: false }).limit(30);
            const select = document.getElementById('evento_select');
            if(error) {
                select.innerHTML = '<option value="">Error cargando eventos</option>';
            } else {
                select.innerHTML = '<option value="">-- Selecciona un evento --</option>';
                data.forEach(ev => {
                    const opt = document.createElement('option');
                    opt.value = ev.id;
                    let fechaStr = '';
                    try {
                        const horario = JSON.parse(ev.horario || '[]');
                        if(horario.length > 0) fechaStr = ` (${horario[0].fecha})`;
                    } catch(e) {}
                    opt.textContent = ev.nombre + fechaStr;
                    // Guardamos horario y portada en dataset para usarlos al cambiar el select
                    opt.dataset.horario = ev.horario;
                    opt.dataset.portada = ev.portada || '';
                    opt.dataset.tipo = ev.tipo || '';
                    select.appendChild(opt);
                });

                select.addEventListener('change', (e) => {
                    document.getElementById('evento_id').value = e.target.value;
                    const selectedOpt = e.target.options[e.target.selectedIndex];
                    actualizarSelectorSesiones(selectedOpt.dataset.horario);
                    mostrarPortada(selectedOpt.dataset.portada);
                    mostrarTipoActividad(selectedOpt.dataset.tipo);
                });
            }
        }

        // --- INTERACTIVITY: STARS ---
        const stars = document.querySelectorAll('.star');
        const starInput = document.getElementById('facilidad');
        const starText = document.getElementById('star-text');
        const starTexts = { 1: "1 - Muy insatisfecho", 2: "2 - Insatisfecho", 3: "3 - Regular", 4: "4 - Satisfecho", 5: "5 - Muy satisfecho" };
        
        stars.forEach(star => {
            star.addEventListener('mouseover', function() {
                let val = this.getAttribute('data-val');
                stars.forEach(s => s.classList.remove('hover'));
                stars.forEach(s => {
                    if (s.getAttribute('data-val') <= val) s.classList.add('hover');
                });
            });
            star.addEventListener('mouseout', function() {
                stars.forEach(s => s.classList.remove('hover'));
            });
            star.addEventListener('click', function() {
                let val = this.getAttribute('data-val');
                starInput.value = val;
                stars.forEach(s => s.classList.remove('active'));
                stars.forEach(s => {
                    if (s.getAttribute('data-val') <= val) s.classList.add('active');
                });
                starText.textContent = starTexts[val];
                starText.style.color = '#eab308';
            });
        });

        // --- INTERACTIVITY: NPS ---
        const npsGroup = document.getElementById('nps-group');
        const npsInput = document.getElementById('nps');
        for (let i = 0; i <= 10; i++) {
            let btn = document.createElement('div');
            btn.className = 'nps-btn';
            btn.textContent = i;
            btn.addEventListener('click', function() {
                document.querySelectorAll('.nps-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                npsInput.value = i;
            });
            npsGroup.appendChild(btn);
        }

        // Envío de Formulario
        document.getElementById('encuesta-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validaciones custom
            if(!starInput.value) {
                alert('Por favor selecciona tu nivel de satisfacción usando las estrellas.');
                return;
            }
            if(!npsInput.value) {
                alert('Por favor selecciona tu nivel de recomendación (0 al 10).');
                return;
            }

            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Enviando...';

            const dniVal = document.getElementById('dni').value.trim();
            const nombresVal = document.getElementById('nombres').value.trim();
            const apellidosVal = document.getElementById('apellidos').value.trim();
            const correoVal = document.getElementById('correo').value.trim();
            const tipoUsuarioVal = document.getElementById('tipo_usuario').value;
            const eventoIdVal = document.getElementById('evento_id').value || null;

            // Validaciones
            let valid = true;
            if (tipoUsuarioVal === 'estudiante') {
                if (dniVal.length < 8) {
                    document.getElementById('dni-error').style.display = 'block';
                    valid = false;
                } else {
                    document.getElementById('dni-error').style.display = 'none';
                }
                const correoValLower = correoVal.toLowerCase();
                if (!correoValLower.endsWith('@certus.edu.pe')) {
                    document.getElementById('correo-error').style.display = 'block';
                    valid = false;
                } else {
                    document.getElementById('correo-error').style.display = 'none';
                }
            } else if (tipoUsuarioVal === 'docente') {
                document.getElementById('dni-error').style.display = 'none'; // Sin validación estricta de digitos
                const correoValLower = correoVal.toLowerCase();
                if (!correoValLower.endsWith('@certus.edu.pe')) {
                    document.getElementById('correo-error').style.display = 'block';
                    valid = false;
                } else {
                    document.getElementById('correo-error').style.display = 'none';
                }
            } else {
                // Egresado / Invitado: sin validación de correo institucional
                document.getElementById('dni-error').style.display = 'none';
                document.getElementById('correo-error').style.display = 'none';
            }

            if (!valid) {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Enviar Respuestas';
                return;
            }

            const sedeVal = document.getElementById('sede').value;
            const docenteVal = document.getElementById('docente') ? document.getElementById('docente').value.trim() : null;

            const moduloSesionVal = document.getElementById('modulo_sesion').value;

            const TIPOS_PARTICIPANTE = { estudiante: 'Estudiante', docente: 'Docente', egresado: 'Egresado', invitado: 'Invitado' };
            const payload = {
                evento_id: eventoIdVal,
                participante_nombre: nombresVal + ' ' + apellidosVal,
                nombres: nombresVal,
                apellidos: apellidosVal,
                dni: dniVal,
                correo: correoVal,
                tipo_participante: TIPOS_PARTICIPANTE[tipoUsuarioVal] || '',
                fecha_llenado: new Date().toISOString(),
                modulo_sesion: moduloSesionVal,
                facilidad: parseInt(starInput.value),
                cumplio_expectativas: 'Si', 
                nps: parseInt(npsInput.value),
                comentarios: document.getElementById('comentarios').value
            };
            
            // Si la tabla en Supabase tiene estas columnas, las agregamos dinámicamente
            if (sedeVal) payload.sede = sedeVal;
            if (docenteVal) payload.docente = docenteVal;

            // 1. Guardar la encuesta
            const { error: errorEncuesta } = await sbClient.from('asistencia_encuesta').insert([payload]);

            // 2. Registrar/Actualizar al participante en Supabase (Opcional, pero muy recomendado)
            // Se asume que existe la tabla 'participantes' y/o 'asistencias' basada en el DNI y evento.
            // Aquí podemos hacer un Upsert del participante:
            if(eventoIdVal) {
                const partPayload = {
                    evento_id: eventoIdVal,
                    dni: dniVal,
                    nombres: nombresVal,
                    apellidos: apellidosVal,
                    correo: correoVal
                };
                // Intenta insertar la asistencia (ignora error si falla o ya existe si está la lógica RLS)
                await sbClient.from('asistencias').insert([partPayload]);
            }

            if (errorEncuesta) {
                console.error(errorEncuesta);
                alert('Hubo un error guardando la encuesta. Inténtalo de nuevo.');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Enviar Respuestas';
            } else {
                document.getElementById('encuesta-form').style.display = 'none';
                document.getElementById('success-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
