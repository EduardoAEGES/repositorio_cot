<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos de Estudiantes - EQUIPO-COT-PLN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css?v=6">
    <link rel="stylesheet" href="dashboard_primer_ciclo.css?v=3">
    <link rel="stylesheet" href="estudiantes.css?v=4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="LOGO_CERTUS.png" alt="Certus Logo" class="certus-logo">
            <div class="site-title">EQUIPO-COT-PLN</div>
        </div>
        <a href="index.html" class="btn-inicio" title="Volver a la página principal">
            <i class="fas fa-house"></i> <span class="lg">Volver a Inicio</span><span class="sm">Inicio</span>
        </a>
    </header>

    <main class="dash-main">
        <div class="dash-head">
            <h1><i class="fas fa-address-book"></i> Datos de estudiantes</h1>
            <div class="dash-actions">
                <div class="search-box search-dark">
                    <i class="fas fa-search"></i>
                    <input type="text" id="q" placeholder="DNI, nombre, correo, NRC, sección..." autocomplete="off">
                </div>
                <button id="btnClear" class="btn btn-ghost" title="Quitar todos los filtros"><i class="fas fa-eraser"></i> Limpiar</button>
                <button id="btnDni" class="btn btn-ghost" title="Copiar los DNI del filtro"><i class="fas fa-copy"></i> Copiar DNIs</button>
                <button id="btnMail" class="btn btn-ghost" title="Generar listas y bloques de correos"><i class="fas fa-envelope"></i> Correos</button>
                <button id="btnXls" class="btn btn-ghost" title="Descargar en Excel"><i class="fas fa-file-excel"></i> Excel</button>
                <button id="btnSync" class="btn btn-solid" title="Volver a copiar la hoja BBDD a la base de datos"><i class="fas fa-rotate"></i> Sincronizar</button>
            </div>
        </div>

        <div id="status" class="dash-status"></div>

        <!-- ============ FILTROS ============ -->
        <section class="filters">
            <div class="f-row">
                <div class="f-group g-wide">
                    <span class="f-label">Periodo</span>
                    <div class="ms" id="msCiclo"></div>
                </div>
                <div class="f-sep"></div>
                <div class="f-group g-wide">
                    <span class="f-label">Programa</span>
                    <div class="ms" id="msPrograma"></div>
                </div>
            </div>
            <div class="f-row">
                <div class="f-group g-wide">
                    <span class="f-label">Curso</span>
                    <div class="ms" id="msCurso"></div>
                </div>
                <div class="f-sep"></div>
                <div class="f-group g-wide">
                    <span class="f-label">Sección</span>
                    <div class="ms" id="msSeccion"></div>
                </div>
            </div>
            <div class="f-row">
                <div class="f-group g-wide">
                    <span class="f-label">Docente</span>
                    <div class="ms" id="msDocente"></div>
                </div>
                <div class="f-sep"></div>
                <div class="f-group g-wide">
                    <span class="f-label">Coordinador</span>
                    <div class="ms" id="msCoord"></div>
                </div>
            </div>
            <div class="f-row">
                <div class="f-group g-nar">
                    <span class="f-label">Turno</span>
                    <div class="chips" id="fTurno"></div>
                </div>
                <div class="f-sep"></div>
                <div class="f-group g-nar">
                    <span class="f-label">Módulo</span>
                    <div class="chips" id="fModulo"></div>
                </div>
                <div class="f-sep"></div>
                <div class="f-group g-nar">
                    <span class="f-label">Modalidad</span>
                    <div class="chips" id="fModalidad"></div>
                </div>
                <div class="f-sep"></div>
                <div class="f-group g-wide">
                    <span class="f-label">Sede</span>
                    <div class="chips" id="fSede"></div>
                </div>
            </div>
        </section>

        <!-- ============ KPIs ============ -->
        <section class="kpis" id="kpis"></section>

        <!-- ============ RESULTADOS ============ -->
        <section class="panel">
            <div class="panel-h">
                <h3><i class="fas fa-table-list"></i> Resultados</h3>
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap">
                    <span class="f-label" style="min-width:auto">Ver</span>
                    <div class="chips" id="vista">
                        <button class="chip on" data-v="alumnos">Estudiantes (1 fila por DNI)</button>
                        <button class="chip" data-v="matriculas">Matrículas (1 fila por curso)</button>
                    </div>
                </div>
            </div>
            <div class="tbl-scroll">
                <table class="dash-tbl" id="tbl">
                    <thead id="tblHead"></thead>
                    <tbody id="tblBody">
                        <tr><td><div class="loading"><i class="fas fa-spinner fa-spin"></i><br>Cargando...</div></td></tr>
                    </tbody>
                </table>
            </div>
            <div class="tbl-foot">
                <span id="tblCount">—</span>
                <span class="pager">
                    <button class="btn-mini" id="pgPrev"><i class="fas fa-chevron-left"></i> Anterior</button>
                    <span id="pgInfo">—</span>
                    <button class="btn-mini" id="pgNext">Siguiente <i class="fas fa-chevron-right"></i></button>
                </span>
                <span id="syncInfo">—</span>
            </div>
        </section>
    </main>

    <!-- ============ FICHA DEL ESTUDIANTE ============ -->
    <div class="modal-bg" id="mdAlumno">
        <div class="modal">
            <div class="modal-h">
                <h3 id="alTitulo">Estudiante</h3>
                <button class="modal-x" data-close title="Cerrar"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-b" id="alCuerpo"></div>
        </div>
    </div>

    <!-- ============ CORREOS ============ -->
    <div class="modal-bg" id="mdCorreos">
        <div class="modal modal-wide">
            <div class="modal-h">
                <h3><i class="fas fa-envelope"></i> Correos del filtro actual <span class="hint" id="mcResumen"></span></h3>
                <button class="modal-x" data-close title="Cerrar"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-b">
                <div class="mc-opts">
                    <div class="f-group g-nar">
                        <span class="f-label">Separador</span>
                        <div class="chips" id="mcSep">
                            <button class="chip on" data-v="; ">Punto y coma (Outlook)</button>
                            <button class="chip" data-v=", ">Coma (Gmail)</button>
                            <button class="chip" data-v="&#10;">Uno por línea</button>
                        </div>
                    </div>
                    <div class="f-group g-nar">
                        <span class="f-label">Bloques de</span>
                        <div class="chips" id="mcTam">
                            <button class="chip" data-v="0">Todos juntos</button>
                            <button class="chip" data-v="50">50</button>
                            <button class="chip on" data-v="100">100</button>
                            <button class="chip" data-v="250">250</button>
                            <button class="chip" data-v="500">500</button>
                        </div>
                    </div>
                    <div class="f-group g-nar">
                        <span class="f-label">Agrupar</span>
                        <div class="chips" id="mcGrupo">
                            <button class="chip on" data-v="no">Lista única</button>
                            <button class="chip" data-v="si">Por curso y sección</button>
                        </div>
                    </div>
                </div>
                <div id="mcBloques"></div>
            </div>
        </div>
    </div>

    <script src="estudiantes.js?v=3"></script>
</body>
</html>
