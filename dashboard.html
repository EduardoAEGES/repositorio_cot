<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EQUIPO-COT-PLN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .dashboard-main {
            padding: 2rem 5% 3rem;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 1.5rem;
        }

        .dashboard-header h1 {
            font-size: 1.8rem;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .dashboard-header h1 i {
            color: #008272;
        }

        .back-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            background: var(--card-background);
            box-shadow: var(--shadow);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px 0 rgba(31, 38, 135, 0.15);
        }

        .fullscreen-btn {
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border-radius: 10px;
            background: #008272;
            border: none;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .fullscreen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px 0 rgba(0, 130, 114, 0.3);
        }

        /* Responsive 16:9 embed that fills available width */
        .report-frame {
            position: relative;
            width: 100%;
            padding-top: 47.5%; /* ~1140x541 aspect ratio */
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            background: var(--card-background);
        }

        .report-frame iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        @media (max-width: 768px) {
            .report-frame {
                padding-top: 130%; /* taller on mobile for readability */
            }
            .dashboard-header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="LOGO_CERTUS.png" alt="Certus Logo" class="certus-logo">
            <div class="site-title">EQUIPO-COT-PLN</div>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link">Página principal</a>
        </nav>
    </header>

    <main class="dashboard-main">
        <div class="dashboard-header">
            <h1><i class="fas fa-chart-column"></i> Dashboard</h1>
            <div style="display:flex; gap:12px; flex-wrap:wrap;">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Volver</a>
                <a href="https://app.powerbi.com/view?r=eyJrIjoiZDY1ZWQ5NmYtZGFkMC00MzY1LTgyNDQtODJjZTg4YjhlNWZlIiwidCI6Ijc1MDRlMzE4LThlMWUtNGQ1NS1iZmZkLTg3NWI0ZGVlODI2MCIsImMiOjR9" target="_blank" rel="noopener" class="fullscreen-btn"><i class="fas fa-up-right-from-square"></i> Abrir en pantalla completa</a>
            </div>
        </div>

        <div class="report-frame">
            <iframe title="REPORTE" src="https://app.powerbi.com/view?r=eyJrIjoiZDY1ZWQ5NmYtZGFkMC00MzY1LTgyNDQtODJjZTg4YjhlNWZlIiwidCI6Ijc1MDRlMzE4LThlMWUtNGQ1NS1iZmZkLTg3NWI0ZGVlODI2MCIsImMiOjR9" frameborder="0" allowFullScreen="true"></iframe>
        </div>
    </main>
</body>
</html>
