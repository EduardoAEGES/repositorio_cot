<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario Semanal - Equipo COT</title>
    <link rel="stylesheet" href="horario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            
            <!-- Título compacto y botón para comprimir panel -->
            <div class="logo-area-framed">
                <div class="logo-title-wrap">
                    <img src="LOGO_CERTUS.png" alt="Certus Logo" class="certus-logo">
                    <h1>HORARIOS - EQUIPO COT PLN</h1>
                </div>
                <button id="toggleControlsBtn" class="toggle-panel-btn" title="Expandir / Contraer Controles">
                    <i class="fas fa-compress-arrows-alt"></i> <span>Ocultar Controles</span>
                </button>
            </div>
            
            <!-- Controles enmarcados -->
            <div id="collapsibleControls" class="controls-frame">
                
                <!-- Izquierda: Búsqueda de Docente -->
                <div class="controls-left">
                    
                    <!-- Selector de Grupo Oculto para ahorrar espacio -->
                    <div class="group-section" style="display: none;">
                        <nav class="group-selector" id="groupSelector"></nav>
                        <button id="addGroupBtn" style="display: none;"></button>
                    </div>

                    <!-- Búsqueda de Docente -->
                    <div class="user-search-area" id="teacherSearchArea">
                        <label class="control-label">
                            <i class="far fa-user"></i> DOCENTE
                        </label>
                        <div class="search-bar-row">
                            <div class="search-input-wrapper">
                                <i class="fas fa-search search-icon"></i>
                                <input type="text" id="userSearchInput" placeholder="Buscar por apellidos y nombres..." autocomplete="off">
                                <i class="fas fa-times clear-search-icon" id="clearSearchBtn" title="Limpiar búsqueda" style="display: none;"></i>
                                <ul id="searchResults" class="search-results hidden"></ul>
                            </div>
                            <button id="searchScheduleBtn" class="primary-btn search-btn">
                                <i class="fas fa-search"></i> BUSCAR HORARIO
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Derecha: Acciones y Filtros -->
                <div class="action-bar-framed">
                    
                    <!-- Filtros de Módulo -->
                    <div class="module-filters">
                        <label>
                            <input type="checkbox" id="junio1Check" value="1"> JUNIO 1
                        </label>
                        <label>
                            <input type="checkbox" id="junio2Check" value="2" checked> JUNIO 2
                        </label>
                        <label>
                            <input type="checkbox" id="agosto1Check" value="1" checked> AGOSTO 1
                        </label>
                        <label>
                            <input type="checkbox" id="agosto2Check" value="2"> AGOSTO 2
                        </label>
                        <label>
                            <input type="checkbox" id="setiembre1Check" value="1"> SETIEMBRE 1
                        </label>
                        <label>
                            <input type="checkbox" id="setiembre2Check" value="2"> SETIEMBRE 2
                        </label>
                        <label>
                            <input type="checkbox" id="octubre1Check" value="1"> OCTUBRE 1
                        </label>
                        <label>
                            <input type="checkbox" id="octubre2Check" value="2"> OCTUBRE 2
                        </label>
                    </div>
                    
                    <!-- Botones de Acción -->
                    <div class="action-buttons">
                        <button id="returnToPtcBtn" class="primary-btn-outline return-btn" style="display: none;">
                            <i class="fas fa-undo"></i> Volver a PTC
                        </button>
                    </div>
                </div>
                
                <!-- Contenedor de docentes del grupo activo (botones y botón de Añadir) -->
                <div style="width: 100%;">
                    <nav class="user-selector" id="userSelector" style="display: none; width: 100%; margin-top: 4px; gap: 6px; flex-wrap: wrap;">
                    </nav>
                </div>
                
                <!-- Resumen de Carga Horaria y Contrato -->
                <div id="teacherStatsContainer" class="teacher-stats-container" style="width: 100%;"></div>
            </div>
        </header>

        <main class="schedule-grid-container">
            <div id="scheduleGrid" class="schedule-grid">
                <div class="grid-header">
                    <div class="time-col">Hora</div>
                    <div class="day-col">Lunes</div>
                    <div class="day-col">Martes</div>
                    <div class="day-col">Miércoles</div>
                    <div class="day-col">Jueves</div>
                    <div class="day-col">Viernes</div>
                    <div class="day-col">Sábado</div>
                </div>
                
                <div class="grid-body" id="gridBody">
                    <!-- Rows will be injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <div style="margin-top: 50px; text-align: center; border-top: 1px solid #f1f5f9; padding-top: 20px; padding-bottom: 20px;">
        <button id="masterBtn" style="background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 5px; transition: color 0.3s;">
            <i class="fas fa-shield-alt"></i> Acceso Master
        </button>
    </div>

    <!-- Modal for Adding/Editing Course -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Curso</h2>
                <span class="close" style="cursor:pointer">&times;</span>
            </div>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                <input type="hidden" id="clickedDay">
                <!-- Hidden fields for change detection and deletion of old records -->
                <input type="hidden" id="oldCourseName">
                <input type="hidden" id="oldCourseUser">
                <input type="hidden" id="oldCourseModality">
                <input type="hidden" id="oldCourseSede">
                <input type="hidden" id="oldCourseSection">
                <input type="hidden" id="oldCourseNRC">
                
                <div class="form-group">
                    <label for="courseUserSelect">Usuario</label>
                    <select id="courseUserSelect" required>
                        <option value="TODOS">👥 TODOS (Evento Conjunto)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="courseName">Nombre del Curso</label>
                    <input type="text" id="courseName" required placeholder="Ej: Matematica">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="courseSection">Sección (Opcional)</label>
                        <input type="text" id="courseSection" placeholder="Ej: 222M">
                    </div>
                    <div class="form-group">
                        <label for="courseNRC">NRC (Opcional)</label>
                        <input type="text" id="courseNRC" placeholder="Ej: 1331">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="courseRoom">Salón (Opcional)</label>
                        <input type="text" id="courseRoom" placeholder="Ej: A-301">
                    </div>
                    <div class="form-group">
                        <label for="courseModality">Modalidad</label>
                        <select id="courseModality" required>
                            <option value="Presencial">Presencial</option>
                            <option value="Virtual">Virtual</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="courseSede">Sede</label>
                    <select id="courseSede" required>
                        <option value="AQP">AQP</option>
                        <option value="ATE">ATE</option>
                        <option value="SURCO">SURCO</option>
                        <option value="NOR">NOR</option>
                        <option value="SJL">SJL</option>
                        <option value="VIRTUAL">VIRTUAL</option>
                        <option value="VES">VES</option>
                        <option value="OTROS">OTROS</option>
                    </select>
                </div>
                
                <div id="schedulesContainer">
                    <!-- Schedule blocks will be injected here -->
                </div>
                
                <div class="form-group" style="margin-top: 10px;">
                    <button type="button" id="addScheduleBlockBtn" class="primary-btn-outline" style="width: 100%;">
                        <i class="fas fa-plus"></i> Agregar otro horario
                    </button>
                </div>

                
                <div class="delete-options hidden" id="deleteOptions">
                    <button type="button" id="deleteDayBtn" class="danger-btn-outline">Eliminar solo este día</button>
                    <button type="button" id="deleteBtn" class="danger-btn">Eliminar todo el curso</button>
                </div>

                <div class="form-actions">
                    <button type="submit" class="success-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Detalle del Curso (solo lectura - Diseño Horizontal y Decorado en 3 Columnas) -->
    <div id="courseDetailModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999; background-color: rgba(15, 23, 42, 0.75); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
        <div style="width: 100%; max-width: 980px; max-height: 92vh; overflow-y: auto; background: #ffffff; border-radius: 16px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid rgba(255,255,255,0.2); margin: auto; display: flex; flex-direction: column; box-sizing: border-box;">
            <div id="courseDetailBody" style="display: flex; flex-direction: column; width: 100%; box-sizing: border-box;"></div>
        </div>
    </div>

    <script src="horario.js"></script>
</body>
</html>
