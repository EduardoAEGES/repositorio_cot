<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario Semanal - Equipo COT</title>
    <link rel="stylesheet" href="horario.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header style="flex-direction: column; align-items: stretch; gap: 20px; border-bottom: none; margin-bottom: 25px; padding-bottom: 0;">
            
            <!-- Título largo y bonito -->
            <div class="logo-area" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6); padding: 25px 30px; border-radius: 12px; text-align: center; color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);">
                <h1 style="color: white; margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">HORARIOS - EQUIPO COT PLN</h1>
            </div>
            
            <!-- Controles enmarcados -->
            <div class="controls-frame" style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 20px;">
                
                <!-- Izquierda: Grupos y Búsqueda -->
                <div style="display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap;">
                    
                    <!-- Selector de Grupo -->
                    <div>
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; display: flex; align-items: center; gap: 5px; margin-bottom: 8px;">
                            <i class="fas fa-users"></i> EQUIPO
                        </label>
                        <div class="group-controls">
                            <nav class="group-selector" id="groupSelector">
                                <!-- Groups will be injected by JS -->
                            </nav>
                            <button id="addGroupBtn" class="icon-btn" title="Agregar Grupo">
                                <i class="fas fa-folder-plus"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Búsqueda de Docente -->
                    <div class="user-search-area" id="teacherSearchArea" style="display: flex; flex-direction: column; margin: 0;">
                        <label style="font-size: 0.75rem; font-weight: 700; color: #64748b; display: flex; align-items: center; gap: 5px; margin-bottom: 8px;">
                            <i class="far fa-user"></i> DOCENTE
                        </label>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <div class="search-input-wrapper" style="width: 350px; position: relative;">
                                <i class="fas fa-search search-icon" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
                                <input type="text" id="userSearchInput" placeholder="Buscar por apellidos y nombres..." autocomplete="off" style="width: 100%; padding: 10px 30px 10px 40px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.9rem; transition: all 0.2s;">
                                <i class="fas fa-times clear-search-icon" id="clearSearchBtn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #ef4444; cursor: pointer; display: none;" title="Limpiar búsqueda"></i>
                                <ul id="searchResults" class="search-results hidden"></ul>
                            </div>
                            <button id="searchScheduleBtn" class="primary-btn" style="background-color: #3b82f6; border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer; font-weight: 600; font-size: 0.9rem; box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3); transition: all 0.2s;">
                                <i class="fas fa-search"></i> BUSCAR HORARIO
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Derecha: Acciones y Filtros -->
                <div class="action-bar" style="display: flex; flex-direction: column; align-items: flex-end; gap: 12px; width: auto;">
                    
                    <!-- Filtros de Módulo -->
                    <div class="module-filters" style="display: flex; gap: 12px; align-items: center; font-weight: 600; font-size: 0.85rem; color: #334155; background: #f8fafc; padding: 10px 16px; border-radius: 8px; border: 1px solid #e2e8f0;">
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; transition: color 0.2s;">
                            <input type="checkbox" id="mod1Check" value="1" style="accent-color: #3b82f6; width: 16px; height: 16px;"> MARZO 1
                        </label>
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; transition: color 0.2s;">
                            <input type="checkbox" id="mod2Check" value="2" style="accent-color: #3b82f6; width: 16px; height: 16px;" checked> MARZO 2
                        </label>
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; transition: color 0.2s;">
                            <input type="checkbox" id="junio1Check" value="1" style="accent-color: #3b82f6; width: 16px; height: 16px;" checked> JUNIO 1
                        </label>
                        <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; transition: color 0.2s;">
                            <input type="checkbox" id="junio2Check" value="2" style="accent-color: #3b82f6; width: 16px; height: 16px;"> JUNIO 2
                        </label>
                    </div>
                    
                    <!-- Botones de Acción -->
                    <div style="display: flex; gap: 10px;">
                        <button id="addCourseBtn" class="primary-btn" style="border-radius: 8px; font-weight: 600;">
                            <i class="fas fa-plus"></i> Agregar Curso
                        </button>
                        <button id="btnConvertExcel" class="primary-btn-outline" style="border: 1px solid #10b981; color: #10b981; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; background: transparent;">
                            <i class="fas fa-file-excel"></i> Exportar
                        </button>
                        <button id="returnToPtcBtn" class="primary-btn-outline" style="display: none; border: 1px solid #ef4444; color: #ef4444; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s; background: transparent;">
                            <i class="fas fa-undo"></i> Volver a PTC
                        </button>
                    </div>
                </div>
                
            </div>
            
            <!-- Legacy container, hidden but kept for JS stability -->
            <nav class="user-selector" id="userSelector" style="display: none; flex-wrap: wrap; gap: 8px; align-items: center;">
            </nav>
        </header>

        <main class="schedule-grid-container">
            <div id="scheduleGrid" class="schedule-grid">
                <div class="grid-header">
                    <div class="time-col">Hora</div>
                    <div class="day-col">Lunes</div>
                    <div class="day-col">Martes</div>
                    <div class="day-col">Miércoles</div>
                    <div class="day-col">Jueves</div>
                    <div class="day-col">Viernes</div>
                    <div class="day-col">Sábado</div>
                    <div class="day-col">Domingo</div>
                </div>
                
                <div class="grid-body" id="gridBody">
                    <!-- Rows will be injected by JS -->
                </div>
            </div>
        </main>
    </div>

    <div style="margin-top: 50px; text-align: center; border-top: 1px solid #f1f5f9; padding-top: 20px; padding-bottom: 20px;">
        <button id="masterBtn" style="background: none; border: none; cursor: pointer; color: #94a3b8; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 5px; transition: color 0.3s;">
            <i class="fas fa-shield-alt"></i> Acceso Master
        </button>
    </div>

    <!-- Modal for Adding/Editing Course -->
    <div id="courseModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo Curso</h2>
                <span class="close" style="cursor:pointer">&times;</span>
            </div>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                <input type="hidden" id="clickedDay">
                <!-- Hidden fields for change detection and deletion of old records -->
                <input type="hidden" id="oldCourseName">
                <input type="hidden" id="oldCourseUser">
                <input type="hidden" id="oldCourseModality">
                <input type="hidden" id="oldCourseSede">
                <input type="hidden" id="oldCourseSection">
                <input type="hidden" id="oldCourseNRC">
                
                <div class="form-group">
                    <label for="courseUserSelect">Usuario</label>
                    <select id="courseUserSelect" required>
                        <option value="TODOS">👥 TODOS (Evento Conjunto)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="courseName">Nombre del Curso</label>
                    <input type="text" id="courseName" required placeholder="Ej: Matematica">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="courseSection">Sección (Opcional)</label>
                        <input type="text" id="courseSection" placeholder="Ej: 222M">
                    </div>
                    <div class="form-group">
                        <label for="courseNRC">NRC (Opcional)</label>
                        <input type="text" id="courseNRC" placeholder="Ej: 1331">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="courseRoom">Salón (Opcional)</label>
                        <input type="text" id="courseRoom" placeholder="Ej: A-301">
                    </div>
                    <div class="form-group">
                        <label for="courseModality">Modalidad</label>
                        <select id="courseModality" required>
                            <option value="Presencial">Presencial</option>
                            <option value="Virtual">Virtual</option>
                            <option value="Híbrido">Híbrido</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="courseSede">Sede</label>
                    <select id="courseSede" required>
                        <option value="AQP">AQP</option>
                        <option value="ATE">ATE</option>
                        <option value="SURCO">SURCO</option>
                        <option value="NOR">NOR</option>
                        <option value="SJL">SJL</option>
                        <option value="VIRTUAL">VIRTUAL</option>
                        <option value="VES">VES</option>
                        <option value="OTROS">OTROS</option>
                    </select>
                </div>
                
                <div id="schedulesContainer">
                    <!-- Schedule blocks will be injected here -->
                </div>
                
                <div class="form-group" style="margin-top: 10px;">
                    <button type="button" id="addScheduleBlockBtn" class="primary-btn-outline" style="width: 100%;">
                        <i class="fas fa-plus"></i> Agregar otro horario
                    </button>
                </div>

                
                <div class="delete-options hidden" id="deleteOptions">
                    <button type="button" id="deleteDayBtn" class="danger-btn-outline">Eliminar solo este día</button>
                    <button type="button" id="deleteBtn" class="danger-btn">Eliminar todo el curso</button>
                </div>

                <div class="form-actions">
                    <button type="submit" class="success-btn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="horario.js"></script>
</body>
</html>
